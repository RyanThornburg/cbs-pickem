[project]
name = "cbs-pickem"
version = "0.1.0"
description = "Data pipeline for a CBS Sports NFL Pick'em pool: scrapes CBS, pulls game/odds/weather data, stores it in Cloudflare D1 and writes JSON to KV for the web UI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "stamina>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov=api --cov=db --cov-report=term-missing:skip-covered"
